[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-thread-console"
version = "0.1.0"
description = "Local Web and shell control surface for Codex threads"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-codex==0.144.4",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
codex-thread-console = "codex_thread_console.cli:main"
codex-thread-console-server = "codex_thread_console.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_thread_console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
