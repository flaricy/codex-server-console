<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Codex Thread Console</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <span class="eyebrow">LOCAL CONTROL SURFACE</span>
          <h1>Codex Thread Console</h1>
        </div>
        <div class="policy">one shared app-server · per-thread FIFO</div>
      </header>

      <main>
        <aside class="threads">
          <div class="panel-title">
            <span>Threads</span>
            <div>
              <button id="refresh" class="icon" title="Refresh">↻</button>
              <button id="new-thread">New</button>
            </div>
          </div>
          <label class="toggle"><input id="archived" type="checkbox" /> Show archived</label>
          <label class="toggle"><input id="created-here" type="checkbox" /> Created here only</label>
          <div id="thread-list"></div>
        </aside>

        <section class="workspace">
          <div class="terminal-toolbar">
            <div>
              <span id="selected-title">No thread selected</span>
              <span id="ownership" class="badge">idle</span>
              <span id="terminal-status" class="terminal-status">Disconnected</span>
            </div>
            <div>
              <button id="archive-thread" disabled>Archive</button>
              <button id="interrupt-turn" disabled>Interrupt</button>
              <button id="attach" disabled>Attach CLI</button>
            </div>
          </div>
          <div id="terminal-frame">
            <div id="terminal"></div>
          </div>
          <div class="composer">
            <select id="message-mode" disabled>
              <option value="send">Start turn through shared app-server</option>
              <option value="queue">Queue through atomic backend</option>
            </select>
            <textarea id="message" rows="2" placeholder="Message for the selected thread"></textarea>
            <button id="submit-message" disabled>Submit</button>
            <details id="turn-options" class="turn-options">
              <summary>Turn options <span>send / queue only</span></summary>
              <div class="turn-options-grid">
                <label>Model<input id="turn-model" placeholder="server default" /></label>
                <label>Effort
                  <select id="turn-effort">
                    <option value="">server default</option>
                    <option value="minimal">minimal</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="xhigh">xhigh</option>
                  </select>
                </label>
                <label>Summary
                  <select id="turn-summary">
                    <option value="">server default</option>
                    <option value="none">none</option>
                    <option value="auto">auto</option>
                    <option value="concise">concise</option>
                    <option value="detailed">detailed</option>
                  </select>
                </label>
                <label>Personality
                  <select id="turn-personality">
                    <option value="">server default</option>
                    <option value="none">none</option>
                    <option value="friendly">friendly</option>
                    <option value="pragmatic">pragmatic</option>
                  </select>
                </label>
                <label>CWD<input id="turn-cwd" placeholder="thread cwd" /></label>
                <label>Service tier<input id="turn-service-tier" placeholder="server default" /></label>
                <label class="schema-field">Output schema (JSON object)
                  <textarea id="turn-output-schema" rows="3" placeholder='{"type":"object","properties":{}}'></textarea>
                </label>
              </div>
            </details>
          </div>
        </section>

        <aside class="activity">
          <div class="panel-title">
            <span>Activity</span>
            <div class="activity-controls">
              <span id="event-status" class="event-status">Connecting</span>
              <button id="clear-log" class="icon" title="Clear activity">×</button>
            </div>
          </div>
          <div id="activity-list" role="log" aria-live="polite"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
